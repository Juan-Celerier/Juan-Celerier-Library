services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: library-api
    # FORZAMOS MODO DEV: Lee directamente tus archivos .ts y aplica el bypass de login
    command: yarn workspace library-system-api dev
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker Compose}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: library-images
    volumes:
      - ./apps/api/data:/app/apps/api/data
      - ./apps/api:/app/apps/api
      # Sincronizamos la carpeta domain para evitar errores de módulos faltantes
      - ./domain:/app/domain
      - /app/apps/api/node_modules
      - /app/domain/node_modules
    networks:
      - library-network
    healthcheck:
      test: [
          "CMD-SHELL",
          # Ajustado a la raíz: quitamos el /api/ para que Docker no lo vea "unhealthy"
          "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s # Tiempo de gracia para que tsx watch compile en memoria
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: library-web
    ports:
      - "5173:80"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Desde tu navegador en Fedora, la API es localhost:3000
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: library-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - library-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 3

volumes:
  minio_data:

networks:
  library-network:
    driver: bridge
