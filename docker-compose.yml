services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - booklend-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      JWT_SECRET: your-secret-key-change-in-production
    volumes:
      - ./apps/api/data:/app/data
    networks:
      - booklend-network

networks:
  booklend-network:
    driver: bridge
