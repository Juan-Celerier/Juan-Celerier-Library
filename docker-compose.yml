services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: library-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # Configuración para MinIO dentro de la red de Docker
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: library-images
    volumes:
      - ./apps/api/data:/app/apps/api/data
      # MEJORA: Sincroniza tu código local con el contenedor para desarrollo en vivo
      - ./apps/api:/app/apps/api
      # Evita que los node_modules del host sobrescriban los del contenedor
      - /app/apps/api/node_modules
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: library-web
    ports:
      - "5173:80" 
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:3000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: library-minio
    ports:
      - "9000:9000" # API de MinIO
      - "9001:9001" # Consola de MinIO
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks: 
      - library-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 3

volumes:
  minio_data:

networks:
  library-network:
    driver: bridge